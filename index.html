<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склады М-Пласт</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
<script type="importmap">
{"imports":{"@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2"}}
</script>
</head>
<body class="bg-[#f4f5f7] min-h-screen">

<div id="auth" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center mx-auto mb-4 text-white font-bold text-xl">М</div>
      <h1 class="text-2xl font-bold text-slate-900">Склады М-Пласт</h1>
      <p class="text-slate-500 text-sm mt-1">Вход для сотрудников</p>
    </div>
    <input id="email" placeholder="Логин или Email" class="w-full border border-slate-200 p-3 rounded-xl mb-3 outline-none focus:border-slate-900">
    <input id="password" type="password" placeholder="Пароль" class="w-full border border-slate-200 p-3 rounded-xl mb-4 outline-none focus:border-slate-900">
    <button onclick="window.doLogin()" class="w-full bg-slate-900 text-white p-3 rounded-xl font-medium hover:bg-black transition">Войти</button>
    <p id="authMsg" class="text-sm text-red-600 mt-3 text-center whitespace-pre-wrap"></p>
    <p id="debug" class="text-xs text-slate-400 text-center mt-2"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold">М</div>
        <span class="font-bold text-slate-900">Склады М-Пласт</span>
        <span id="userRole" class="ml-2 px-3 py-1 bg-slate-100 rounded-full text-xs font-medium uppercase"></span>
      </div>
      <div class="flex items-center gap-4">
        <span id="userEmail" class="text-sm text-slate-600"></span>
        <button onclick="window.doLogout()" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl transition">Выйти</button>
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-6 py-6">
    <div id="adminPanel" class="hidden bg-white rounded-2xl p-6 shadow-sm border mb-6">
      <h3 class="font-semibold mb-4">Управление сотрудниками</h3>
      <div class="grid grid-cols-5 gap-3 mb-4">
        <input id="u_email" placeholder="Логин или Email" class="border border-slate-200 p-2.5 rounded-xl text-sm">
        <input id="u_pass" placeholder="Пароль" class="border border-slate-200 p-2.5 rounded-xl text-sm">
        <input id="u_name" placeholder="ФИО" class="border border-slate-200 p-2.5 rounded-xl text-sm">
        <select id="u_role" class="border border-slate-200 p-2.5 rounded-xl text-sm">
          <option value="manager">Менеджер</option><option value="storekeeper">Кладовщик</option><option value="observer">Наблюдатель</option><option value="admin">Админ</option>
        </select>
        <button onclick="window.createUser()" class="bg-slate-900 text-white rounded-xl text-sm font-medium">Создать</button>
      </div>
      <div id="usersList" class="divide-y text-sm"></div>
      <p id="userMsg" class="text-sm mt-2"></p>
    </div>
    <div id="warehousesView">
      <h2 class="text-xl font-bold text-slate-900 mb-6">Выберите склад</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <button onclick="window.openWarehouse('Механики')" class="bg-white rounded-2xl p-8 shadow-sm border hover:shadow-md transition text-left"><div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mb-4 font-bold text-blue-700">М</div><div class="font-semibold">Механики</div><div id="count-Механики" class="text-sm text-slate-500 mt-1">0 товаров</div></button>
        <button onclick="window.openWarehouse('Причалы')" class="bg-white rounded-2xl p-8 shadow-sm border hover:shadow-md transition text-left"><div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center mb-4 font-bold text-emerald-700">П</div><div class="font-semibold">Причалы</div><div id="count-Причалы" class="text-sm text-slate-500 mt-1">0 товаров</div></button>
        <button onclick="window.openWarehouse('ЮГ')" class="bg-white rounded-2xl p-8 shadow-sm border hover:shadow-md transition text-left"><div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center mb-4 font-bold text-orange-700">Ю</div><div class="font-semibold">ЮГ</div><div id="count-ЮГ" class="text-sm text-slate-500 mt-1">0 товаров</div></button>
        <button onclick="window.openWarehouse('Дмитров')" class="bg-white rounded-2xl p-8 shadow-sm border hover:shadow-md transition text-left"><div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center mb-4 font-bold text-purple-700">Д</div><div class="font-semibold">Дмитров</div><div id="count-Дмитров" class="text-sm text-slate-500 mt-1">0 товаров</div></button>
      </div>
    </div>
    <div id="warehouseDetail" class="hidden">
      <button onclick="window.backToWarehouses()" class="mb-4 text-sm bg-white border px-4 py-2 rounded-xl hover:bg-slate-50">Назад к складам</button>
      <h2 id="warehouseTitle" class="text-xl font-bold mb-6"></h2>
      <div class="grid grid-cols-3 gap-6">
        <div class="col-span-2">
          <div id="addBlock" class="bg-white rounded-2xl p-6 shadow-sm border mb-6">
            <h3 class="font-semibold mb-4">Добавить товар на <span class="warehouseName"></span></h3>
            <div class="grid grid-cols-2 gap-3">
              <input id="p_name" placeholder="Название *" class="border border-slate-200 p-2.5 rounded-xl text-sm">
              <input id="p_article" placeholder="Артикул" class="border border-slate-200 p-2.5 rounded-xl text-sm">
              <input id="p_qty" type="number" placeholder="Количество" class="border border-slate-200 p-2.5 rounded-xl text-sm">
              <input id="p_price" type="number" placeholder="Цена" class="border border-slate-200 p-2.5 rounded-xl text-sm">
              <input id="p_cat" placeholder="Категория" class="border border-slate-200 p-2.5 rounded-xl text-sm col-span-2">
            </div>
            <button onclick="window.addProduct()" id="btnAdd" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition">Добавить</button>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div class="p-6 flex justify-between items-center"><h3 class="font-semibold">Товары</h3><input id="search" oninput="window.loadProducts()" placeholder="Поиск..." class="border border-slate-200 p-2 rounded-xl text-sm w-56"></div>
            <table class="w-full text-sm"><thead><tr class="bg-slate-50 text-slate-500 text-xs uppercase"><th class="p-3 text-left pl-6">Товар</th><th>Кол-во</th><th>Цена</th><th>Категория</th><th class="pr-6">Действия</th></tr></thead><tbody id="products"></tbody></table>
          </div>
        </div>
        <div class="bg-white rounded-2xl p-6 shadow-sm border h-fit"><h3 class="font-semibold mb-3">История</h3><div id="history" class="text-sm space-y-2 max-h-[600px] overflow-auto"></div></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { createClient } from '@supabase/supabase-js'
const supabase = createClient('https://qytvxettegrzyyhfzvrz.supabase.co','sb_publishable_SzrxETdLRvuSJ36Ohe-xmA_uyRiqqcD');
window.supabase = supabase;
let currentProfile=null, currentWarehouse=null;
const WAREHOUSES=['Механики','Причалы','ЮГ','Дмитров'];

window.doLogin = async () => {
  const raw = document.getElementById('email').value.trim();
  let e = raw.toLowerCase();
  if(e && !e.includes('@')) e = e+'@m-plast.local';
  const p = document.getElementById('password').value;
  document.getElementById('debug').textContent = 'Пробую войти как: ' + e;
  if(!e || !p){ document.getElementById('authMsg').textContent='Введите логин и пароль'; return; }
  document.getElementById('authMsg').textContent='Вход...';
  const { data, error } = await supabase.auth.signInWithPassword({ email: e, password: p });
  if(error){
    document.getElementById('authMsg').textContent = error.message + '\nПроверь в Supabase Authentication > Users есть ли этот email и подтвержден ли он';
    console.error(error);
  } else { checkUser(); }
}
window.doLogout = async () => { await supabase.auth.signOut(); location.reload(); }
async function checkUser(){
  const { data:{user} } = await supabase.auth.getUser();
  if(!user) return;
  const { data, error } = await supabase.from('profiles').select('*').eq('id', user.id).single();
  if(error){ document.getElementById('authMsg').textContent='Профиль не найден: '+error.message; return; }
  currentProfile=data;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userEmail').textContent=user.email;
  document.getElementById('userRole').textContent=data.role;
  if(data.role==='admin'){ document.getElementById('adminPanel').classList.remove('hidden'); loadUsers(); }
  if(data.role==='observer'){ document.getElementById('btnAdd').disabled=true; document.getElementById('addBlock').classList.add('opacity-40','pointer-events-none'); }
  loadCounts();
}
window.openWarehouse = (name) => {
  currentWarehouse=name;
  document.getElementById('warehousesView').classList.add('hidden');
  document.getElementById('warehouseDetail').classList.remove('hidden');
  document.getElementById('warehouseTitle').textContent='Склад: '+name;
  document.querySelectorAll('.warehouseName').forEach(el=>el.textContent=name);
  window.loadProducts(); loadHistory();
}
window.backToWarehouses = () => { document.getElementById('warehouseDetail').classList.add('hidden'); document.getElementById('warehousesView').classList.remove('hidden'); loadCounts(); }
async function loadCounts(){
  const { data } = await supabase.from('products').select('warehouse');
  WAREHOUSES.forEach(w=>{ const c=(data||[]).filter(p=>p.warehouse===w).length; const el=document.getElementById('count-'+w); if(el) el.textContent=c+' товаров'; });
}
window.createUser = async () => {
  let raw=document.getElementById('u_email').value.trim().toLowerCase();
  let e=raw.includes('@')?raw:raw+'@m-plast.local';
  const { data, error } = await supabase.auth.signUp({ email:e, password:document.getElementById('u_pass').value, options:{data:{full_name:document.getElementById('u_name').value}}});
  if(error){ document.getElementById('userMsg').textContent=error.message; return; }
  if(data.user) await supabase.from('profiles').update({role:document.getElementById('u_role').value, full_name:document.getElementById('u_name').value}).eq('id',data.user.id);
  document.getElementById('userMsg').textContent='Создан: '+e; loadUsers();
}
async function loadUsers(){
  const { data } = await supabase.from('profiles').select('*').order('created_at');
  document.getElementById('usersList').innerHTML=(data||[]).map(u=>`<div class="flex justify-between py-3"><div><b>${u.email}</b> ${u.full_name||''} - ${u.role}</div><div class="flex gap-1"><button onclick="window.setRole('${u.id}','admin')" class="px-2 hover:bg-slate-100 rounded">admin</button><button onclick="window.setRole('${u.id}','observer')" class="px-2 hover:bg-slate-100 rounded">observer</button><button onclick="window.delUser('${u.id}')" class="text-red-600 ml-2">удалить</button></div></div>`).join('');
}
window.setRole=async(id,role)=>{ await supabase.from('profiles').update({role}).eq('id',id); loadUsers(); }
window.delUser=async(id)=>{ if(!confirm('Удалить?'))return; await supabase.from('profiles').delete().eq('id',id); loadUsers(); }
window.addProduct=async()=>{
  if(!document.getElementById('p_name').value) return alert('Введите название');
  const {error}=await supabase.from('products').insert([{name:document.getElementById('p_name').value, article:document.getElementById('p_article').value, quantity:parseInt(document.getElementById('p_qty').value)||0, price:parseFloat(document.getElementById('p_price').value)||0, category:document.getElementById('p_cat').value, warehouse:currentWarehouse}]);
  if(error) alert(error.message); else { ['p_name','p_article','p_qty','p_price','p_cat'].forEach(id=>document.getElementById(id).value=''); window.loadProducts(); loadCounts(); }
}
window.loadProducts=async()=>{
  const { data } = await supabase.from('products').select('*').eq('warehouse',currentWarehouse).order('created_at',{ascending:false});
  let f=data||[]; const s=document.getElementById('search').value; if(s) f=f.filter(p=>p.name.toLowerCase().includes(s.toLowerCase()));
  document.getElementById('products').innerHTML=f.length?f.map(p=>`<tr class="border-t"><td class="p-3 pl-6">${p.name}<div class="text-xs text-slate-400">${p.article||''}</div></td><td>${p.quantity}</td><td>${p.price} ₽</td><td>${p.category||'-'}</td><td><button onclick="window.move('${p.id}',${p.quantity},'приход')" class="bg-emerald-50 px-3 py-1 rounded-full text-xs mr-1">+ Приход</button><button onclick="window.move('${p.id}',${p.quantity},'расход')" class="bg-red-50 px-3 py-1 rounded-full text-xs">- Расход</button></td></tr>`).join(''):`<tr><td colspan="5" class="p-6 text-center text-slate-400">Нет товаров</td></tr>`;
}
window.move=async(id,qty,type)=>{
  let n=parseInt(prompt(`Сколько ${type}?`)); if(!n) return;
  let newQty=type==='приход'?qty+n:qty-n; if(newQty<0) return alert('Недостаточно');
  await supabase.from('products').update({quantity:newQty}).eq('id',id);
  await supabase.from('movements').insert([{product_id:id, type, quantity:n, user_id:currentProfile.id}]);
  window.loadProducts(); loadHistory(); loadCounts();
}
async function loadHistory(){
  const { data } = await supabase.from('movements').select('*, products(name,warehouse)').order('created_at',{ascending:false}).limit(30);
  let f=(data||[]).filter(m=>m.products?.warehouse===currentWarehouse);
  document.getElementById('history').innerHTML=!f.length?'<p class="text-slate-400 text-xs">Нет движений</p>':f.map(m=>`<div class="flex justify-between border-b pb-2 text-xs"><span class="${m.type==='приход'?'text-emerald-600':'text-red-600'}">${m.type} ${m.quantity}</span><span>${m.products?.name||''}</span><span class="text-slate-400">${new Date(m.created_at).toLocaleDateString()}</span></div>`).join('');
}
checkUser();
</script>
</body>
</html>
