<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склады М-Пласт</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f4f5f7] min-h-screen">
<!-- LOGIN -->
<div id="auth" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center mx-auto mb-4 text-white font-bold text-xl">М</div>
      <h1 class="text-2xl font-bold text-slate-900">Склады М-Пласт</h1>
      <p class="text-slate-500 text-sm mt-1">Вход для сотрудников</p>
    </div>
    <input id="email" placeholder="Логин" class="w-full border border-slate-200 p-3 rounded-xl mb-3 outline-none focus:border-slate-900">
    <input id="password" type="password" placeholder="Пароль" class="w-full border border-slate-200 p-3 rounded-xl mb-4 outline-none focus:border-slate-900">
    <button onclick="login()" class="w-full bg-slate-900 text-white p-3 rounded-xl font-medium hover:bg-black transition">Войти в систему</button>
    <p id="authMsg" class="text-sm text-red-600 mt-3 text-center"></p>
    <p class="text-xs text-slate-400 text-center mt-6">Доступ выдает администратор</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold">М</div>
        <span class="font-bold text-slate-900">Склады М-Пласт</span>
        <span id="userRole" class="ml-2 px-3 py-1 bg-slate-100 rounded-full text-xs font-medium uppercase"></span>
      </div>
      <div class="flex items-center gap-4">
        <span id="userEmail" class="text-sm text-slate-600"></span>
        <button onclick="logout()" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl transition">Выйти</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6">
    <!-- Админ панель -->
    <div id="adminPanel" class="hidden bg-white rounded-2xl p-6 shadow-sm border mb-6">
      <h3 class="font-semibold mb-4">Управление сотрудниками</h3>
      <div class="grid grid-cols-5 gap-3 mb-4">
        <input id="u_email" placeholder="Логин (напр. ivanov)" class="border border-slate-200 p-2.5 rounded-xl text-sm">
        <input id="u_pass" placeholder="Пароль" class="border border-slate-200 p-2.5 rounded-xl text-sm">
        <input id="u_name" placeholder="ФИО" class="border border-slate-200 p-2.5 rounded-xl text-sm">
        <select id="u_role" class="border border-slate-200 p-2.5 rounded-xl text-sm">
          <option value="manager">Менеджер</option>
          <option value="storekeeper">Кладовщик</option>
          <option value="observer">Наблюдатель</option>
          <option value="admin">Админ</option>
        </select>
        <button onclick="createUser()" class="bg-slate-900 text-white rounded-xl text-sm font-medium">Создать сотрудника</button>
      </div>
      <div id="usersList" class="divide-y text-sm"></div>
      <p id="userMsg" class="text-sm mt-2"></p>
    </div>

    <div class="grid grid-cols-3 gap-6">
      <div class="col-span-2">
        <div id="addBlock" class="bg-white rounded-2xl p-6 shadow-sm border mb-6">
          <h2 class="font-semibold mb-4">Добавить товар</h2>
          <div class="grid grid-cols-2 gap-3">
            <input id="p_name" placeholder="Название *" class="border border-slate-200 p-2.5 rounded-xl text-sm">
            <input id="p_article" placeholder="Артикул" class="border border-slate-200 p-2.5 rounded-xl text-sm">
            <input id="p_qty" type="number" placeholder="Количество" class="border border-slate-200 p-2.5 rounded-xl text-sm">
            <input id="p_price" type="number" placeholder="Цена" class="border border-slate-200 p-2.5 rounded-xl text-sm">
            <input id="p_cat" placeholder="Категория" class="border border-slate-200 p-2.5 rounded-xl text-sm col-span-2">
          </div>
          <button onclick="addProduct()" id="btnAdd" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition">Добавить на склад</button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
          <div class="p-6 flex justify-between items-center">
            <h2 class="font-semibold">Товары на складе</h2>
            <input id="search" oninput="loadProducts()" placeholder="Поиск по названию" class="border border-slate-200 p-2 rounded-xl text-sm w-56">
          </div>
          <table class="w-full text-sm">
            <thead><tr class="bg-slate-50 text-slate-500 text-xs uppercase"><th class="p-3 text-left pl-6">Товар</th><th>Кол-во</th><th>Цена</th><th>Категория</th><th class="pr-6">Действия</th></tr></thead>
            <tbody id="products"></tbody>
          </table>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border h-fit">
        <h3 class="font-semibold mb-3">История движений</h3>
        <div id="history" class="text-sm space-y-2 max-h-[600px] overflow-auto"></div>
      </div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://qytvxettegrzyyhfzvrz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SzrxETdLRvuSJ36Ohe-xmA_uyRiqqcD';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentProfile = null;

function normalizeLogin(v){
  v=v.trim().toLowerCase();
  if(!v.includes('@')) v=v+'@m-plast.local';
  return v;
}

async function login(){
  let e = normalizeLogin(email.value);
  const { error } = await supabase.auth.signInWithPassword({ email: e, password: password.value });
  if(error) authMsg.textContent = 'Неверный логин или пароль';
  else checkUser();
}
async function logout(){ await supabase.auth.signOut(); location.reload(); }

async function checkUser(){
  const { data: { user } } = await supabase.auth.getUser();
  if(!user) return;
  const { data } = await supabase.from('profiles').select('*').eq('id', user.id).single();
  if(!data) return;
  currentProfile = data;
  auth.classList.add('hidden');
  app.classList.remove('hidden');
  userEmail.textContent = user.email.replace('@m-plast.local','');
  userRole.textContent = data.role;
  if(data.role === 'admin') adminPanel.classList.remove('hidden'), loadUsers();
  if(data.role === 'observer') { btnAdd.disabled=true; btnAdd.classList.add('opacity-40'); addBlock.classList.add('opacity-40','pointer-events-none'); }
  loadProducts(); loadHistory();
}

async function createUser(){
  let e = normalizeLogin(u_email.value);
  userMsg.textContent = 'Создание...';
  const { data, error } = await supabase.auth.signUp({
    email: e, password: u_pass.value,
    options: { data: { full_name: u_name.value } }
  });
  if(error){ userMsg.textContent = error.message; userMsg.className='text-sm mt-2 text-red-600'; return; }
  // обновляем роль
  if(data.user){
    await supabase.from('profiles').update({ role: u_role.value, full_name: u_name.value }).eq('id', data.user.id);
  }
  userMsg.textContent = 'Сотрудник создан: ' + e.replace('@m-plast.local','');
  userMsg.className='text-sm mt-2 text-emerald-600';
  loadUsers();
}

async function loadUsers(){
  const { data } = await supabase.from('profiles').select('*').order('created_at');
  usersList.innerHTML = data.map(u => `
    <div class="flex justify-between items-center py-3">
      <div><b>${u.email.replace('@m-plast.local','')}</b> <span class="text-slate-500">${u.full_name||''}</span> - <span class="px-2 py-1 bg-slate-100 rounded-full text-xs">${u.role}</span></div>
      <div class="flex gap-1">
        <button onclick="setRole('${u.id}','admin')" class="px-2 py-1 hover:bg-slate-100 rounded">admin</button>
        <button onclick="setRole('${u.id}','manager')" class="px-2 py-1 hover:bg-slate-100 rounded">manager</button>
        <button onclick="setRole('${u.id}','storekeeper')" class="px-2 py-1 hover:bg-slate-100 rounded">кладовщик</button>
        <button onclick="setRole('${u.id}','observer')" class="px-2 py-1 hover:bg-slate-100 rounded">observer</button>
        <button onclick="delUser('${u.id}')" class="text-red-600 ml-2">удалить</button>
      </div>
    </div>`).join('');
}
async function setRole(id, role){ await supabase.from('profiles').update({role}).eq('id', id); loadUsers(); checkUser(); }
async function delUser(id){ if(!confirm('Удалить сотрудника?'))return; await supabase.from('profiles').delete().eq('id', id); loadUsers(); }

async function addProduct(){
  if(currentProfile.role === 'observer') return alert('Нет прав');
  if(!p_name.value) return alert('Введите название');
  const { error } = await supabase.from('products').insert([{
    name: p_name.value, article: p_article.value,
    quantity: parseInt(p_qty.value)||0, price: parseFloat(p_price.value)||0, category: p_cat.value
  }]);
  if(error) alert(error.message); else { p_name.value=''; p_article.value=''; p_qty.value=''; p_price.value=''; p_cat.value=''; loadProducts(); }
}
async function loadProducts(){
  const { data } = await supabase.from('products').select('*').order('created_at',{ascending:false});
  let f = data||[];
  if(search.value) f=f.filter(p=>p.name.toLowerCase().includes(search.value.toLowerCase()));
  products.innerHTML = f.map(p=>`<tr class="border-t hover:bg-slate-50">
    <td class="p-3 pl-6"><div class="font-medium">${p.name}</div><div class="text-xs text-slate-400">${p.article||''}</div></td>
    <td><span class="${p.quantity<5?'text-red-600 font-bold':''}">${p.quantity}</span></td>
    <td>${p.price} ₽</td><td><span class="px-2 py-1 bg-slate-100 rounded-full text-xs">${p.category||'-'}</span></td>
    <td class="pr-6">
      <button onclick="move('${p.id}',${p.quantity},'приход')" class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs mr-1">+ Приход</button>
      <button onclick="move('${p.id}',${p.quantity},'расход')" class="bg-red-50 text-red-700 px-3 py-1 rounded-full text-xs">- Расход</button>
      ${currentProfile.role==='admin'?`<button onclick="delProduct('${p.id}')" class="ml-2 text-slate-400 hover:text-red-600 text-xs">×</button>`:''}
    </td></tr>`).join('');
}
async function move(id, qty, type){
  if(currentProfile.role==='observer') return alert('Нет прав');
  let n=parseInt(prompt(`Сколько единиц ${type}?`)); if(!n) return;
  let newQty = type==='приход'?qty+n:qty-n; if(newQty<0) return alert('Недостаточно на складе');
  await supabase.from('products').update({quantity:newQty}).eq('id',id);
  await supabase.from('movements').insert([{product_id:id, type, quantity:n, user_id:currentProfile.id}]);
  loadProducts(); loadHistory();
}
async function delProduct(id){ if(!confirm('Удалить товар?'))return; await supabase.from('products').delete().eq('id',id); loadProducts(); }
async function loadHistory(){
  const { data } = await supabase.from('movements').select('*, products(name)').order('created_at',{ascending:false}).limit(20);
  if(!data||!data.length) history.innerHTML='<p class="text-slate-400 text-xs">Пока нет движений</p>';
  else history.innerHTML=data.map(m=>`<div class="flex justify-between border-b pb-2"><span class="${m.type==='приход'?'text-emerald-600':'text-red-600'}">${m.type} ${m.quantity}</span> <span>${m.products?.name||''}</span> <span class="text-slate-400 text-xs">${new Date(m.created_at).toLocaleDateString()}</span></div>`).join('');
}
checkUser();
</script>
</body>
</html>
